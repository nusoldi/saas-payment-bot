# Replaces run.yml, which must stay disabled in the Actions tab: that one
# downloads an unpinned tsx from npm on every run while holding the key.
name: Pay invoices

on:
  schedule:
    - cron: "17 0 * * *" # 00:17 UTC daily; GitHub delays or drops runs queued at the top of the hour
  workflow_dispatch:
    inputs:
      dry_run:
        description: Dry run (show what would be paid, send nothing)
        type: boolean
        default: true

permissions: {}

concurrency:
  group: pay-invoices
  cancel-in-progress: false

jobs:
  pay:
    name: Pay invoices
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      LIST_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install locked dependencies
        run: |
          yarn install --frozen-lockfile --ignore-scripts --non-interactive
          npm ci --prefix tools --ignore-scripts --no-audit --no-fund

      - name: Check secrets
        run: tools/node_modules/.bin/tsx tools/check-secrets.ts
        env:
          RPC_URL: ${{ secrets.RPC_URL }}
          VOTE_KEY: ${{ secrets.VOTE_KEY }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}

      - name: Run bot
        # A run can fail right after it buys tokens; a second run a minute later pays.
        # bot.ts exits 0 even when it leaves invoices unpaid, so its log decides
        # whether the run fails (and GitHub sends an email).
        run: |
          set -o pipefail
          run_bot() { tools/node_modules/.bin/tsx bot.ts 2>&1 | tee bot.log; }
          run_bot || { sleep 60; run_bot; }
          unpaid=0
          if grep -q '^SECURITY: refusing to pay' bot.log; then
            echo "::error::An invoicer that is not on the trusted list is billing your validator. Check with The Vault before trusting it."
            unpaid=1
          fi
          if grep -qE '^(Still short|Nothing payable)' bot.log; then
            echo "::error::The bot left invoices unpaid. The 'Still short' line above lists them."
            unpaid=1
          fi
          exit "$unpaid"
        env:
          RPC_URL: ${{ secrets.RPC_URL }}
          VOTE_KEY: ${{ secrets.VOTE_KEY }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}

  keepalive:
    # GitHub switches off schedules in public repos after 60 days without a commit.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Commit if the repository has been quiet for 45 days
        run: |
          if [ $(( $(date +%s) - $(git log -1 --format=%ct) )) -gt $(( 45 * 86400 )) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Keep the daily payment schedule enabled"
            git push
          fi
